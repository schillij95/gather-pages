<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gather Legal and Support</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fbf8f3;
        --surface: #ffffff;
        --text: #1d3026;
        --muted: #667266;
        --border: #dce5d5;
        --accent: #6f8f59;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 56px 20px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 38px;
        line-height: 1.08;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
        font-weight: 700;
      }
      nav {
        display: grid;
        gap: 12px;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Gather</h1>
        <p>Public legal and support pages for the Gather meal planning app.</p>
        <nav aria-label="Legal pages">
          <a href="/privacy-policy.html">Privacy Policy</a>
          <a href="/data-deletion.html">Data Deletion</a>
          <a href="/terms.html">Terms of Use</a>
        </nav>
      </section>
    </main>
  </body>
</html>
